name: Build and Release Vocitap macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run PyInstaller Build
        run: |
          cd mac_app
          rm -rf build dist Vocitap.app
          pyinstaller --clean Vocitap_mac.spec
          if [ -d "dist/Vocitap.app" ]; then
            mv dist/Vocitap.app .
            echo "Build completed successfully!"
          else
            echo "Build failed!"
            exit 1
          fi
          rm -rf build dist

      - name: Compress App Bundle into ZIP
        run: |
          cd mac_app
          zip -r Vocitap_mac.zip Vocitap.app

      - name: Upload macOS Asset to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ "$TAG_NAME" = "refs/heads/main" ] || [ "$TAG_NAME" = "refs/heads/latest-slim" ] || [ -z "$TAG_NAME" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_NAME=$(gh release list --limit 1 | awk '{print $3}')
            if [ -z "$TAG_NAME" ]; then
              TAG_NAME="v5.7.2"
            fi
          fi
          
          echo "Target Release Tag: $TAG_NAME"
          
          gh release upload "$TAG_NAME" mac_app/Vocitap_mac.zip --clobber
