name: Build and Release Vocitap macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build, Compress, and Upload macOS App
        shell: python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          import subprocess
          import shutil
          import os
          
          root_dir = os.getcwd()
          mac_app_dir = os.path.join(root_dir, "mac_app")
          
          # 1. 编译
          os.chdir(mac_app_dir)
          for p in ["build", "dist", "Vocitap.app", "Vocitap_mac.zip"]:
              if os.path.exists(p):
                  if os.path.isdir(p): shutil.rmtree(p)
                  else: os.remove(p)
                  
          print("1. Running PyInstaller build...")
          subprocess.run(["pyinstaller", "--clean", "Vocitap_mac.spec"], check=True)
          
          if os.path.exists("dist/Vocitap.app"):
              shutil.move("dist/Vocitap.app", ".")
              print("Build completed successfully!")
          else:
              raise Exception("Build failed: Vocitap.app not found in dist")
              
          # 2. 压缩为 ZIP
          print("2. Compressing Vocitap.app into Vocitap_mac.zip...")
          subprocess.run(["zip", "-r", "Vocitap_mac.zip", "Vocitap.app"], check=True)
          
          # 3. 确定 Tag 名称并使用 gh CLI 上传
          print("3. Uploading macOS asset to GitHub Release...")
          ref = os.environ.get("GITHUB_REF", "")
          tag_name = ref.replace("refs/tags/", "") if ref.startswith("refs/tags/") else ""
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          
          if not tag_name or event_name == "workflow_dispatch":
              # 如果是手动触发，直接通过 gh release view 获取最新的 release tag name
              try:
                  res = subprocess.run(["gh", "release", "view", "--json", "tagName", "--jq", ".tagName"], capture_output=True, text=True, check=True)
                  tag_name = res.stdout.strip()
              except Exception as e:
                  print(f"Failed to query latest release tag: {e}")
                  
          if not tag_name:
              tag_name = "v5.7.2"
              
          print(f"Target release tag: {tag_name}")
          
          # 上传
          subprocess.run(["gh", "release", "upload", tag_name, "Vocitap_mac.zip", "--clobber"], check=True)
          print("Successfully uploaded macOS App asset to GitHub Release!")
